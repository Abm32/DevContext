kind = "web"
previewPath = "/"
title = "DevContext – Resume Your Code Brain"
version = "1.0.0"
id = "artifacts/devcontext"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21481

[services.development]
run = "pnpm --filter @workspace/devcontext run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devcontext", "run", "build" ]
publicDir = "artifacts/devcontext/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21481"
BASE_PATH = "/"
