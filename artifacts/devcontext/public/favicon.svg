<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#0A0A0B"/>
  <rect width="180" height="180" rx="36" fill="url(#bg_grad)" opacity="0.6"/>
  <!-- Central node -->
  <circle cx="90" cy="90" r="10" fill="url(#core_grad)"/>
  <!-- Inner ring nodes -->
  <circle cx="90" cy="58" r="5.5" fill="#6366f1" opacity="0.9"/>
  <circle cx="90" cy="122" r="5.5" fill="#6366f1" opacity="0.9"/>
  <circle cx="58" cy="90" r="5.5" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="122" cy="90" r="5.5" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="67" cy="67" r="4.5" fill="#6366f1" opacity="0.75"/>
  <circle cx="113" cy="67" r="4.5" fill="#6366f1" opacity="0.75"/>
  <circle cx="67" cy="113" r="4.5" fill="#8b5cf6" opacity="0.75"/>
  <circle cx="113" cy="113" r="4.5" fill="#8b5cf6" opacity="0.75"/>
  <!-- Connection lines -->
  <line x1="90" y1="90" x2="90" y2="58" stroke="url(#line_grad)" stroke-width="1.5" opacity="0.7"/>
  <line x1="90" y1="90" x2="90" y2="122" stroke="url(#line_grad)" stroke-width="1.5" opacity="0.7"/>
  <line x1="90" y1="90" x2="58" y2="90" stroke="url(#line_grad)" stroke-width="1.5" opacity="0.7"/>
  <line x1="90" y1="90" x2="122" y2="90" stroke="url(#line_grad)" stroke-width="1.5" opacity="0.7"/>
  <line x1="90" y1="90" x2="67" y2="67" stroke="url(#line_grad)" stroke-width="1.2" opacity="0.55"/>
  <line x1="90" y1="90" x2="113" y2="67" stroke="url(#line_grad)" stroke-width="1.2" opacity="0.55"/>
  <line x1="90" y1="90" x2="67" y2="113" stroke="url(#line_grad)" stroke-width="1.2" opacity="0.55"/>
  <line x1="90" y1="90" x2="113" y2="113" stroke="url(#line_grad)" stroke-width="1.2" opacity="0.55"/>
  <!-- Outer ring nodes -->
  <circle cx="90" cy="38" r="3.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="90" cy="142" r="3.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="38" cy="90" r="3.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="142" cy="90" r="3.5" fill="#3b82f6" opacity="0.6"/>
  <!-- Outer connections -->
  <line x1="90" y1="58" x2="90" y2="38" stroke="#3b82f6" stroke-width="1" opacity="0.35"/>
  <line x1="90" y1="122" x2="90" y2="142" stroke="#3b82f6" stroke-width="1" opacity="0.35"/>
  <line x1="58" y1="90" x2="38" y2="90" stroke="#3b82f6" stroke-width="1" opacity="0.35"/>
  <line x1="122" y1="90" x2="142" y2="90" stroke="#3b82f6" stroke-width="1" opacity="0.35"/>
  <!-- Cross connections between inner ring -->
  <line x1="90" y1="58" x2="67" y2="67" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="90" y1="58" x2="113" y2="67" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <line x1="58" y1="90" x2="67" y2="67" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
  <line x1="122" y1="90" x2="113" y2="67" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
  <defs>
    <radialGradient id="bg_grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core_grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>
    <linearGradient id="line_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
</svg>
